<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="IE DIGITAL" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>IE DIGITAL</title>
  <!-- Quatre barres décroissantes, centrées sur l'axe horizontal : c'est ce
       centrage qui fait lire un entonnoir plutôt qu'un diagramme en barres.
       La dernière barre, en vert, est la commande qui aboutit. -->
  <rect x="4"  y="4"    width="4" height="24" fill="#12181A"/>
  <rect x="11" y="7"    width="4" height="18" fill="#12181A"/>
  <rect x="18" y="10.5" width="4" height="11" fill="#12181A"/>
  <rect x="25" y="13.5" width="3" height="5"  fill="#0F6B4A"/>
</svg>
